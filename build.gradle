plugins {
  id 'org.scm-manager.smp' version '0.18.0'
}

repositories {
  mavenCentral()
}

configurations.all {
  resolutionStrategy.eachDependency { details ->
    // The smp plugin pins lombok 1.18.30, which only supports jdk 21. IDEs
    // running on a newer jvm (NetBeans ships its own jdk) cannot process the
    // annotations with it and mark every generated getter as an error.
    if (details.requested.group == 'org.projectlombok' && details.requested.name == 'lombok') {
      details.useVersion '1.18.46'
      details.because 'the pinned version does not support current jdks'
    }
  }
}

// gradle has no profiles, a "profile" is a plain condition on a project property:
//   ./gradlew build -Pstage=release
def releaseStage = findProperty('stage') == 'release'

tasks.withType(Javadoc) {
  // do not complain about missing javadoc, real javadoc errors stay visible
  options.addStringOption('Xdoclint:all,-missing', '-quiet')
  options.encoding = 'UTF-8'

  if (releaseStage) {
    // the javadoc of a release is written next to the sources instead of into the
    // build directory, so it is committed and can be browsed on github
    destinationDir = file('docs/javadoc')
    options.charSet = 'UTF-8'
    options.docTitle = "OAuth2/OIDC Authentication Plugin ${project.version}"
    options.windowTitle = "scm-oauth2-plugin ${project.version}"

    // remove the previous documentation first, otherwise pages of classes which
    // were deleted in the meantime would stay behind
    doFirst {
      destinationDir.deleteDir()
    }
  }
}

dependencies {
  // define dependencies to other plugins here e.g.:
  // plugin "sonia.scm.plugins:scm-mail-plugin:2.1.0"
  // optionalPlugin "sonia.scm.plugins:scm-editor-plugin:2.0.0"
}

scmPlugin {
  scmVersion = "3.9.0"
  displayName = "OAuth2/OIDC Authentication Plugin"
  description = "Authentication for SCM-Manager using OAuth2/OIDC"

  author = "Thorsten Ludewig"
  category = "Authentication"

  openapi {
    packages = [
      "de.l9g.scm.oauth2.plugin",
      "de.l9g.scm.oauth2.plugin.config"
    ]
  }
}
